name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # Unter Windows committet fehlt gradlew oft das Ausführungsrecht
      - run: chmod +x gradlew

      # Tests + SpotBugs + Jar
      - run: ./gradlew build

      # Fester Dateiname, damit die Download-URL immer gleich bleibt
      - run: cp build/libs/Stempeluhr-*.jar Stempeluhr.jar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Stempeluhr
          path: Stempeluhr.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Stempeluhr

      # Nur dieser Tag-Job braucht Schreibrechte für das GitHub Release.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Stempeluhr.jar
          generate_release_notes: true

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # nötig, um Releases anzulegen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Unter Windows committet fehlt gradlew oft das Ausführungsrecht
      - run: chmod +x gradlew

      # Tests + SpotBugs + Jar
      - run: ./gradlew build

      # Fester Dateiname, damit die Download-URL immer gleich bleibt
      - run: cp build/libs/Stempeluhr-*.jar Stempeluhr.jar

      - uses: actions/upload-artifact@v4
        with:
          name: Stempeluhr
          path: Stempeluhr.jar

      # Nur bei Tags wie v1.0.0: GitHub Release mit der Jar anlegen
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Stempeluhr.jar
          generate_release_notes: true
